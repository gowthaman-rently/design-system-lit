packages:
  - 'apps/*'
  - 'packages/*'

# Install-script approvals for dependencies (only read from the workspace root).
# Moved from apps/next-16 (added by create-next-app).
allowBuilds:
  sharp: false
  unrs-resolver: false
  # Storybook / custom-elements analyzer (native binaries come from optional platform packages)
  esbuild: false
  rs-module-lexer: false
