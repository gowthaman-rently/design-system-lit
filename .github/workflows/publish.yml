# Publishes packages/ui (@gowthaman-rently/design-system-lit) to GitHub Packages.
#
# To release: set "version" in packages/ui/package.json (e.g. 0.2.0), push it to
# master, then publish a GitHub Release tagged with the same version (v0.2.0).
# "Run workflow" in the Actions tab publishes the version in package.json.
name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.21.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@gowthaman-rently'

      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="v$(node -p "require('./packages/ui/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME doesn't match packages/ui/package.json ($version)."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter design-system-lit build

      - run: pnpm --filter design-system-lit publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
